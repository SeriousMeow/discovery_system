      - ./server-config.json:/app/server-config.json:ro
    ports:
      - "18082:8080"
    networks:
      ring_net:
        ipv4_address: 172.29.0.13
    command: ["sh", "-c", "sleep 10 && server"]

  server4:
    build:
      context: ..
      dockerfile: docker/dockerfiles/sever.yaml
    image: discovery-system/server:line
    environment:
      DISCOVERY_SERVER_HTTP_ADDR: 0.0.0.0:8080
      DISCOVERY_SERVER_LISTEN_ADDR: 172.29.0.14:8081
      DISCOVERY_SERVER_CONTACT_NODE: 172.29.0.13:8081
      DISCOVERY_SERVER_CONFIG_JSON: /app/server-config.json
    volumes:
      - ./server-config.json:/app/server-config.json:ro
    ports:
      - "18083:8080"
    networks:
      ring_net:
        ipv4_address: 172.29.0.14
    command: ["sh", "-c", "sleep 15 && server"]

  server5:
    build:
      context: ..
