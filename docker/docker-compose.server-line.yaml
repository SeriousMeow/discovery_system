services:
  server1:
    build:
      context: ..
      dockerfile: docker/dockerfiles/sever.yaml
    image: discovery-system/server:line
    environment:
      DISCOVERY_SERVER_HTTP_ADDR: 0.0.0.0:8080
      DISCOVERY_SERVER_LISTEN_ADDR: 172.29.0.11:8081
      DISCOVERY_SERVER_CONFIG_JSON: /app/server-config.json
    volumes:
      - ./server-config.json:/app/server-config.json:ro
    ports:
      - "18080:8080"
    networks:
      ring_net:
        ipv4_address: 172.29.0.11
    command: ["sh", "-c", "sleep 0 && server"]

  server2:
    build:
      context: ..
      dockerfile: docker/dockerfiles/sever.yaml
    image: discovery-system/server:line
    environment:
      DISCOVERY_SERVER_HTTP_ADDR: 0.0.0.0:8080
      DISCOVERY_SERVER_LISTEN_ADDR: 172.29.0.12:8081
      DISCOVERY_SERVER_CONTACT_NODE: 172.29.0.11:8081
      DISCOVERY_SERVER_CONFIG_JSON: /app/server-config.json
    volumes:
      - ./server-config.json:/app/server-config.json:ro
    ports:
      - "18081:8080"
    networks:
      ring_net:
        ipv4_address: 172.29.0.12
    command: ["sh", "-c", "sleep 5 && server"]

  server3:
    build:
      context: ..
