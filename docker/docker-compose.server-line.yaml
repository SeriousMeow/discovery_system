    environment:
      DISCOVERY_SERVER_HTTP_ADDR: 0.0.0.0:8080
      DISCOVERY_SERVER_LISTEN_ADDR: 172.29.0.13:8081
      DISCOVERY_SERVER_CONTACT_NODE: 172.29.0.12:8081
      DISCOVERY_SERVER_CONFIG_JSON: /app/server-config.json
