[workspace]
members = ["client", "server", "messenger", "pow_puzzle"]
resolver = "3"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde_json = "1.0.148"
serde = { version = "1.0.228", features = ["derive"] }
chrono = { version = "0.4.43", features = ["serde"] }
anyhow = "1.0.102"
